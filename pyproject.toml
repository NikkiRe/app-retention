[project]
name = "app-retention"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=2,<3", "numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]

line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
